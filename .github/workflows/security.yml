name: security

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the job token: this workflow only reads the repo and
# queries the npm registry — it never writes to the repo, issues, or checks.
# Without this block the job token inherits the repository default, which
# may be broader; OpenSSF Scorecard's Token-Permissions check verifies it.
permissions: {}

jobs:
  # The gate's own regression suite. It asserts the FAIL-CLOSED contract —
  # every bug this script has had was a path where "we could not check"
  # printed the same "passed" as "we checked and it is clean" — and it runs
  # against stub servers, so it needs no network and no install. Kept as its
  # own job rather than a step in the matrix below so it runs once, and so a
  # broken gate is legible as a broken gate rather than as four failing
  # workspace audits.
  audit-gate-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Audit gate self-tests
        run: node --test scripts/audit-gate.test.mjs

  # Blocking for EVERY tree in the matrix below: high/critical advisories
  # fail the build unless their GHSA id is documented (with a reason) in
  # scripts/audit-allowlist.json — see scripts/audit-gate.mjs. Auditing
  # straight from the lockfile needs no install, so this gate costs seconds.
  # Advisories with no non-breaking fix anywhere in the ecosystem get an
  # allowlist entry instead of demoting the whole job to report-only (which
  # would hide new advisories too); Dependabot (added in this PR) surfaces
  # the upstream releases that let entries be removed.
  dependency-audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      # npm throttles concurrent advisory requests from one runner egress IP.
      # Serialize the four lockfile scans so one workspace cannot force the
      # others onto the retired quick-audit endpoint or into a timeout.
      max-parallel: 1
      matrix:
        # Every directory with its own package-lock.json gets a gate —
        # including the repo root (Playwright e2e tooling) and word-addin,
        # which are just as much shipped-to-developers code as the two
        # server/web workspaces. `find . -name package-lock.json -not -path
        # '*/node_modules/*'` must return exactly these four; a fifth tree
        # arriving without a row here is the failure mode this comment
        # exists to prevent.
        include:
          - workspace: root
            dir: "."
          - workspace: backend
            dir: backend
          - workspace: frontend
            dir: frontend
          - workspace: word-addin
            dir: word-addin
    name: dependency-audit (${{ matrix.workspace }})
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      # Pinned to commit SHAs, not tags — repo-wide posture since #246:
      # tags are mutable, so a compromised action repo could silently swap
      # what "v4" points at; a 40-char SHA cannot be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Dependency security audit
        run: node "$GITHUB_WORKSPACE/scripts/audit-gate.mjs"

  security-baseline:
    permissions:
      contents: read
    name: Frozen security baseline
    runs-on: ubuntu-latest
    steps:
      # Official upstream commits verified before pinning.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The pinned suite contains tests from each app and the root scripts.
      # Install every lockfile exactly as committed; no secrets or providers
      # are required and tests retain the default-on network guard.
      - name: Install root tools
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Word add-in dependencies
        run: npm ci --prefix word-addin

      - name: Backend test and contract typechecks
        run: |
          npm run typecheck:test --prefix backend
          npm run typecheck:contracts --prefix backend
      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend
      - name: Word add-in typecheck
        run: npm run typecheck --prefix word-addin
      - name: Pinned security regression suite
        run: npm run test:security

      - name: Backend production build
        run: npm run build --prefix backend
      - name: Frontend production build
        run: npm run build --prefix frontend
      - name: Word add-in production build
        env:
          REACT_APP_WEB_APP_URL: https://app.example.com
          WORD_ADDIN_PUBLIC_URL: https://word.example.com
        run: npm run build --prefix word-addin
