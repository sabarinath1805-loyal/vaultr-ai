# Mutation testing: prove the security-critical unit tests assert behavior.
#
# Stryker mutates the security-critical modules listed in
# backend/stryker.config.json (access control, download-token signing,
# citation extraction + verification, the SSRF IP guard) and re-runs the
# vitest suite per mutant. A surviving mutant = a behavior change (e.g. an
# access check inverted, a blocked IP range allowed) that no test caught.
#
# ON-DEMAND + monthly cron. Run from the repository root so the sandbox
# preserves backend imports of shared test support and tracked deployment
# fixtures. Vitest remains at the same version used by the regular test suite.
# A missing setup dependency can otherwise look like zero collected tests.
#
# `thresholds.break` in stryker.config.json fails any run whose score
# regresses below the documented floor. See docs/test-depth.md.
name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    # Monthly, on the 3rd at 06:17 UTC (odd minute to dodge the top-of-hour
    # GitHub cron rush). Drift check only — failures show up in the Actions
    # tab, they block nothing.
    - cron: "17 6 3 * *"

permissions: {}

jobs:
  mutation:
    permissions:
      contents: read
    name: Backend mutation testing (security libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Same silent-merge-corruption guard as ci.yml (bit PR #233).
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - run: npm ci

      - run: npm run test:mutation

      # The HTML report is the useful output: per-file, per-mutant detail
      # of what survived. Upload even when the score check fails — a failed
      # run is exactly when you want to read it.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: backend/reports/mutation/
          if-no-files-found: warn
